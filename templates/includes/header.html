<header class="bg-dark text-white py-3">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-4">
                <a href="/" class="text-white text-decoration-none">
                    <h1 class="h3 mb-0">Кожевенная артель «Ветеран»</h1>
                    <small>Изделия из кожи ручной работы</small>
                </a>
            </div>
            <div class="col-md-4">
                <form class="d-flex" role="search" method="get" action="{% url 'catalog:product_list' %}">
                    <input class="form-control me-2" type="search" name="q" placeholder="Поиск товаров..." aria-label="Search" value="{{ query }}">
                    <button class="btn btn-outline-light" type="submit">Найти</button>
                </form>
            </div>
            <div class="col-md-4 text-end">
                <a href="{% url 'cart:detail' %}" class="text-white text-decoration-none me-3">
                    <i class="bi bi-cart"></i> Корзина
                    <span id="cart-counter" class="badge bg-danger rounded-pill">{{ cart|length }}</span>
                </a>
                
                {% if user.is_authenticated %}
                    <div class="dropdown d-inline-block">
                        <a href="#" class="text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person"></i> {{ user.username }}
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="{% url 'users:profile' %}">
                                <i class="bi bi-person-circle"></i> Личный кабинет
                            </a></li>
                            <li><a class="dropdown-item" href="{% url 'users:wishlist' %}">
                                <i class="bi bi-heart"></i> Избранное
                            </a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="{% url 'users:logout' %}">
                                <i class="bi bi-box-arrow-right"></i> Выйти
                            </a></li>
                        </ul>
                    </div>
                {% else %}
                    <a href="{% url 'users:login' %}" class="text-white text-decoration-none">
                        <i class="bi bi-person"></i> Войти
                    </a>
                    <span class="text-white-50 mx-1">|</span>
                    <a href="{% url 'users:register' %}" class="text-white text-decoration-none">
                        Регистрация
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</header>
